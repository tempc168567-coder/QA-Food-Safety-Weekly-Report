name: 更新邊境查驗不符合資料

on:
  schedule:
    # 每日 01:00 UTC（台北時間 09:00）
    - cron: '0 1 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-border-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 抓取食藥署邊境查驗最新公告並更新 data.js
        run: node scripts/update-border-data.js

      - name: 提交變更（若有新資料）
        run: |
          if git diff --quiet -- data.js; then
            echo "無新資料，略過提交。"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.js
          git commit -m "chore: 自動更新邊境查驗不符合資料 ($(date -u +%Y-%m-%d))"
          git push
